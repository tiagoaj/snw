version: "3.8"

services:
  api:
    image: ghcr.io/tiagoaj/snw-api:${SNW_IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: 4000
      APP_ORIGIN: ${APP_ORIGIN:-https://snw.fluinow.com.br}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NOTIFICATION_EMAIL_FROM: ${NOTIFICATION_EMAIL_FROM:-SNW <alertas@fluinow.com.br>}
      MONITOR_INTERVAL_MS: ${MONITOR_INTERVAL_MS:-60000}
      MONITOR_FAILURE_THRESHOLD: ${MONITOR_FAILURE_THRESHOLD:-2}
      ALERT_COOLDOWN_MS: ${ALERT_COOLDOWN_MS:-300000}
      RECONNECT_REQUEST_TTL_MS: ${RECONNECT_REQUEST_TTL_MS:-900000}
    secrets:
      - snw_supabase_service_role_key
      - snw_webhook_secret
      - snw_integration_encryption_key
    networks:
      - snw-internal
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 60s
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 30s

  web:
    image: ghcr.io/tiagoaj/snw-web:${SNW_IMAGE_TAG:-latest}
    networks:
      - snw-internal
      - traefik
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 60s
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 30s
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik-public}"
        - "traefik.swarm.network=${TRAEFIK_NETWORK:-traefik-public}"
        - "traefik.http.services.snw.loadbalancer.server.port=80"
        - "traefik.http.routers.snw.service=snw"
        - "traefik.http.routers.snw.rule=Host(`${SNW_DOMAIN:-snw.fluinow.com.br}`)"
        - "traefik.http.routers.snw.entrypoints=${TRAEFIK_HTTPS_ENTRYPOINT:-websecure}"
        - "traefik.http.routers.snw.tls=true"
        - "traefik.http.routers.snw.tls.certresolver=le"
        - "traefik.http.routers.snw-http.rule=Host(`${SNW_DOMAIN:-snw.fluinow.com.br}`)"
        - "traefik.http.routers.snw-http.entrypoints=${TRAEFIK_HTTP_ENTRYPOINT:-web}"
        - "traefik.http.routers.snw-http.middlewares=snw-redirect-https"
        - "traefik.http.middlewares.snw-redirect-https.redirectscheme.scheme=https"
        - "traefik.http.middlewares.snw-redirect-https.redirectscheme.permanent=true"

networks:
  snw-internal:
    driver: overlay
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik-public}

secrets:
  snw_supabase_service_role_key:
    external: true
  snw_webhook_secret:
    external: true
  snw_integration_encryption_key:
    external: true
